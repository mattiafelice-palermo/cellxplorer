<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CellXplorer — Cycle Navigation Mockup</title>
<style>
:root{--bg:#f7f9fb;--panel:#fff;--line:#dfe5ea;--line2:#cbd4dc;--text:#121820;--muted:#7d8994;--teal:#18b889;--soft:#eaf8f3}
*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--bg);color:var(--text);font:14px Inter,"Segoe UI",Arial,sans-serif}.wrap{max-width:1180px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{padding:18px 20px 8px}.title{font-size:20px;font-weight:750}.sub{margin-top:5px;font-size:13px;color:var(--muted)}
.nav{margin:10px 20px 14px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fbfcfd}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.label{font-weight:650;min-width:124px}.space{flex:1}.group{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}.group button{border:0;border-right:1px solid var(--line2);border-radius:0}.group button:last-child{border-right:0}
button,input,select{height:38px;border:1px solid var(--line2);border-radius:7px;background:#fff;color:var(--text);font:inherit}button{min-width:40px;padding:0 12px;cursor:pointer}button:hover{background:#f5f8fa;border-color:#9daab5}button:disabled{opacity:.42;cursor:default}.group button{min-width:48px;font-size:20px}.num{width:74px;text-align:center;font-weight:650}.window{width:70px;padding:0 8px;font-weight:650}.jump{display:flex;align-items:center;gap:7px;color:#53606b;font-size:12px}.jump input{width:88px;text-align:center}.icon{width:38px;padding:0;font-size:18px}.icon svg{width:18px;height:18px;vertical-align:middle}
.sepwrap{position:relative}.sep{width:42px;min-width:42px;padding:0;border:0;background:transparent;color:#53606b;font-weight:700;font-size:16px}.sep:hover,.sep.on{background:var(--soft);color:#118466}.popover{display:none;position:absolute;z-index:5;left:50%;top:48px;transform:translateX(-50%);width:255px;padding:15px 14px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 26px rgba(20,30,40,.12)}.popover.open{display:block}.popover:before{content:"";position:absolute;left:50%;top:-7px;width:12px;height:12px;background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}.sliderline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.sliderline input{width:100%;height:24px;border:0}.slidertext{text-align:center;color:#64717c;font-size:11px;margin-top:6px}
.hint{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 20px 12px;color:var(--muted);font-size:12px}.plotbox{padding:0 20px 20px}canvas{display:block;width:100%;height:550px;border:1px solid #3e444a;background:#fff}.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;padding-top:12px;color:#5f6973;font-size:12px}.key{display:inline-flex;align-items:center;gap:6px}.sw{width:26px;height:2px}
@media(max-width:800px){body{padding:12px}.space{display:none}.label{width:100%}canvas{height:420px}}
</style>
</head>
<body>
<div class="wrap"><section class="card">
<div class="head"><div class="title">Unsaved plot</div><div class="sub">Cell voltage across selected cycles (mock data)</div></div>
<div class="nav"><div class="row">
<div class="label">Cycle navigation</div>
<select id="window" class="window" aria-label="Cycle window size"><option>1</option><option>5</option><option>10</option><option selected>20</option><option>50</option><option>100</option></select>
<div class="group"><button id="prevPage" title="Previous range">«</button><button id="prevOne" title="Previous cycle">‹</button></div>
<input id="from" class="num" type="number" value="101" min="1" max="720" aria-label="From cycle" />
<div class="sepwrap"><button id="sep" class="sep" title="Move cycle window" aria-label="Open cycle position slider">—o—</button><div id="pop" class="popover"><div class="sliderline"><span>1</span><input id="slider" type="range" min="1" max="720" value="110" /><span>720</span></div><div id="sliderText" class="slidertext">Center at cycle 110</div></div></div>
<input id="to" class="num" type="number" value="120" min="1" max="720" aria-label="To cycle" />
<div class="group"><button id="nextOne" title="Next cycle">›</button><button id="nextPage" title="Next range">»</button></div>
<div class="space"></div>
<button id="back" class="icon" title="Previous cycle view" aria-label="Previous cycle view">←</button>
<button id="home" class="icon" title="Show all cycles" aria-label="Show all cycles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg></button>
<label class="jump">Jump to <input id="jump" type="number" min="1" max="720" placeholder="Cycle" aria-label="Jump to cycle" /></label>
</div></div>
<div class="hint"><span>‹ / › shift by one cycle · « / » move by one full window · Jump to uses Enter</span><span>Fake data · 720 cycles</span></div>
<div class="plotbox"><canvas id="plot"></canvas><div class="legend"><span class="key"><i class="sw" style="background:#18b889"></i>Cell A</span><span class="key"><i class="sw" style="background:#3182bd"></i>Cell B</span><span class="key"><i class="sw" style="background:#e95d5d"></i>Cell C</span><span class="key"><i class="sw" style="background:#f0a24a"></i>Cell D</span></div></div>
</section></div>
<script>
(()=>{const TOTAL=720,C=['#18b889','#3182bd','#e95d5d','#f0a24a'];let from=101,to=120,hist=[],dragStart=null;const $=id=>document.getElementById(id),cv=$('plot'),ctx=cv.getContext('2d'),fromEl=$('from'),toEl=$('to'),win=$('window'),slider=$('slider'),pop=$('pop'),sep=$('sep');const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const width=()=>to-from+1;function noise(x){const v=Math.sin(x*12.9898+78.233)*43758.5453;return v-Math.floor(v)}function meta(c,s){const stage=c<70?0:c<150?1:c<235?2:c<330?3:c<440?4:c<560?5:6,top=[3.58,3.63,3.54,3.66,3.48,3.60,3.44][stage],low=[2.80,2.84,2.90,2.79,2.94,2.86,2.97][stage];let amp=.72+[.08,.01,-.12,.12,-.18,-.05,-.22][stage]+.08*Math.sin(c/14+s)+(noise(c*17+s*31)-.5)*.12;if(c>245&&c<290)amp-=.16*Math.sin((c-245)/45*Math.PI);if(c>480&&c<530)amp+=.12*Math.sin((c-480)/50*Math.PI);return{top:top-.00012*c+.025*Math.sin(c/11+s),low:low+.00006*c+.02*Math.cos(c/17+s),amp:clamp(amp,.35,1.05)}}function yval(c,q,s){const m=meta(c,s);let y;if(q<.12)y=m.low+(m.top-m.low-.3)*(q/.12);else if(q<.48)y=m.top-.3+.28*Math.sqrt((q-.12)/.36);else if(q<.58)y=m.top-.02+.02*Math.sin((q-.48)/.1*Math.PI);else y=m.top-(m.top-m.low-.08)*Math.pow((q-.58)/.42,.8);y+=(noise(c*103+Math.floor(q*80)*19+s*7)-.5)*(.018+.025*(1-m.amp));return clamp(y,2.76,3.69)}function push(){const h=hist.at(-1);if(!h||h[0]!==from||h[1]!==to){hist.push([from,to]);if(hist.length>50)hist.shift()}}function sync(){fromEl.value=from;toEl.value=to;slider.value=Math.round((from+to)/2);$('sliderText').textContent=`Center at cycle ${slider.value}`;$('back').disabled=!hist.length;const w=width(),vals=[1,5,10,20,50,100];if(!vals.includes(w)){const o=document.createElement('option');o.value=o.textContent=String(w);o.dataset.dynamic='1';win.appendChild(o)}[...win.options].forEach(o=>{if(o.dataset.dynamic&&Number(o.value)!==w)o.remove()});win.value=String(w)}function setRange(a,b,record=true){a=clamp(Math.round(a),1,TOTAL);b=clamp(Math.round(b),1,TOTAL);if(b<a)b=a;if(record)push();from=a;to=b;sync();draw()}function setWindow(a,w,record=true){w=clamp(Math.round(w),1,TOTAL);a=clamp(Math.round(a),1,TOTAL-w+1);setRange(a,a+w-1,record)}function center(target,record=true){const w=width();setWindow(clamp(Math.round(target)-Math.floor(w/2),1,TOTAL-w+1),w,record)}$('prevOne').onclick=()=>setWindow(from-1,width());$('nextOne').onclick=()=>setWindow(from+1,width());$('prevPage').onclick=()=>setWindow(from-width(),width());$('nextPage').onclick=()=>setWindow(from+width(),width());win.onchange=()=>setWindow(from,Number(win.value));$('home').onclick=()=>setRange(1,TOTAL);$('back').onclick=()=>{if(!hist.length)return;[from,to]=hist.pop();sync();draw()};fromEl.onchange=()=>{let f=Number(fromEl.value)||1,t=to;if(f>t)t=f;setRange(f,t)};toEl.onchange=()=>{let f=from,t=Number(toEl.value)||f;if(t<f)f=t;setRange(f,t)};$('jump').onkeydown=e=>{if(e.key==='Enter'&&e.currentTarget.value){center(Number(e.currentTarget.value));e.currentTarget.select()}};sep.onclick=e=>{e.stopPropagation();pop.classList.toggle('open');sep.classList.toggle('on');slider.value=Math.round((from+to)/2);$('sliderText').textContent=`Center at cycle ${slider.value}`};slider.onpointerdown=()=>dragStart=[from,to];slider.oninput=()=>{$('sliderText').textContent=`Center at cycle ${slider.value}`};slider.onchange=()=>{if(dragStart){const old=dragStart;dragStart=null;const t=Number(slider.value),w=width(),a=clamp(t-Math.floor(w/2),1,TOTAL-w+1);hist.push(old);from=a;to=a+w-1;sync();draw()}else center(Number(slider.value))};document.addEventListener('click',e=>{if(!pop.contains(e.target)&&e.target!==sep){pop.classList.remove('open');sep.classList.remove('on')}});function draw(){const d=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,H);const m={l:72,r:22,t:22,b:58},pw=W-m.l-m.r,ph=H-m.t-m.b,ymin=2.75,ymax=3.7;ctx.font='12px Segoe UI';ctx.fillStyle='#52606b';ctx.strokeStyle='#e2e7eb';for(let v=2.8;v<=3.6001;v+=.1){const y=m.t+(ymax-v)/(ymax-ymin)*ph;ctx.beginPath();ctx.moveTo(m.l,y);ctx.lineTo(W-m.r,y);ctx.stroke();ctx.fillText(v.toFixed(1),m.l-34,y+4)}for(let i=0;i<=5;i++){const x=m.l+i/5*pw,c=Math.round(from+(to-from)*i/5);ctx.beginPath();ctx.moveTo(x,m.t);ctx.lineTo(x,H-m.b);ctx.stroke();ctx.fillText(String(c),x-8,H-m.b+20)}ctx.strokeStyle='#3e444a';ctx.strokeRect(m.l,m.t,pw,ph);ctx.save();ctx.translate(20,m.t+ph/2);ctx.rotate(-Math.PI/2);ctx.font='16px Segoe UI';ctx.fillStyle='#30383f';ctx.fillText('Cell voltage (V)',-55,0);ctx.restore();ctx.fillText('Cycle number',m.l+pw/2-45,H-18);const n=width(),cw=pw/n;C.forEach((col,s)=>{ctx.strokeStyle=col;ctx.globalAlpha=.75;ctx.lineWidth=n<12?1.8:1.2;for(let c=from;c<=to;c++){ctx.beginPath();for(let j=0;j<42;j++){const q=j/41,x=m.l+(c-from)*cw+q*cw,y=m.t+(ymax-yval(c,q,s))/(ymax-ymin)*ph;j?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}});ctx.globalAlpha=1}window.onresize=draw;sync();draw()})();
</script>
</body></html>
