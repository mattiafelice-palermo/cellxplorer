name: Publish CellXplorer release

# Staged draft publishing (Spec 019 review R2):
# 1) create/update a draft GitHub Release with signed NSIS + latest.json
# 2) verify local latest.json against release-asset metadata
# 3) undraft only after verification succeeds
#
# Pinned third-party actions (full 40-char SHAs):
# - actions/checkout@v6.0.1
# - actions/setup-python@v6.0.0
# - actions/setup-node@v6.0.0
# - dtolnay/rust-toolchain stable (2026-06-30)
# - Swatinem/rust-cache@v2.8.2
# - tauri-apps/tauri-action@v1.0.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel for manual build-only dispatch
        type: choice
        options:
          - stable
          - beta
          - alpha
        default: stable

permissions:
  contents: write
  actions: read

concurrency:
  group: cellxplorer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-06-30

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: src-tauri -> target
          shared-key: cellxplorer-windows-release
          add-job-id-key: "false"
          save-if: "false"

      - parallel:
          - name: Install backend dependencies
            shell: pwsh
            run: |
              python -m pip install --upgrade pip
              python -m pip install -r backend/requirements.txt
              python -m pip install pyinstaller
              python -m pip check

          - name: Install frontend and Tauri CLI dependencies
            shell: pwsh
            run: |
              npm ci
              npm --prefix frontend ci

      - name: Resolve release channel
        id: channel
        shell: pwsh
        run: |
          function Write-ChannelOutputs([string] $channel) {
            switch ($channel) {
              "stable" {
                "channel=stable" >> $env:GITHUB_OUTPUT
                "product_name=CellXplorer" >> $env:GITHUB_OUTPUT
                "config_args=" >> $env:GITHUB_OUTPUT
                "channel_manifest=stable/latest.json" >> $env:GITHUB_OUTPUT
                "is_prerelease=false" >> $env:GITHUB_OUTPUT
                "updater_key_conf=src-tauri/tauri.conf.json" >> $env:GITHUB_OUTPUT
              }
              "beta" {
                "channel=beta" >> $env:GITHUB_OUTPUT
                "product_name=CellXplorer Beta" >> $env:GITHUB_OUTPUT
                "config_args=--config src-tauri/tauri.beta.conf.json" >> $env:GITHUB_OUTPUT
                "channel_manifest=beta/latest.json" >> $env:GITHUB_OUTPUT
                "is_prerelease=true" >> $env:GITHUB_OUTPUT
                "updater_key_conf=src-tauri/tauri.conf.json" >> $env:GITHUB_OUTPUT
              }
              "alpha" {
                "channel=alpha" >> $env:GITHUB_OUTPUT
                "product_name=CellXplorer Alpha" >> $env:GITHUB_OUTPUT
                "config_args=--config src-tauri/tauri.alpha.conf.json" >> $env:GITHUB_OUTPUT
                "channel_manifest=alpha/latest.json" >> $env:GITHUB_OUTPUT
                "is_prerelease=true" >> $env:GITHUB_OUTPUT
                "updater_key_conf=src-tauri/tauri.conf.json" >> $env:GITHUB_OUTPUT
              }
              default {
                Write-Error "Unsupported release channel: $channel"
                exit 1
              }
            }
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/release_tag.py --tag "$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $tag = $env:GITHUB_REF_NAME
            if ($tag -match '^v\d+\.\d+\.\d+-alpha\.(0|[1-9]\d*)$') {
              Write-ChannelOutputs "alpha"
            } elseif ($tag -match '^v\d+\.\d+\.\d+-beta(?:\.\d+|\d+)$') {
              Write-ChannelOutputs "beta"
            } elseif ($tag -match '^v\d+\.\d+\.\d+$') {
              Write-ChannelOutputs "stable"
            } else {
              Write-Error "Could not classify publishable tag $tag as Stable, Beta, or Alpha."
              exit 1
            }
          } else {
            $selected = "${{ github.event.inputs.channel }}"
            if ([string]::IsNullOrWhiteSpace($selected)) { $selected = "stable" }
            Write-ChannelOutputs $selected
          }

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Require publishable SemVer tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: python scripts/release_tag.py --tag "${{ github.ref_name }}"

      - name: Require public repository for publishing
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if ("${{ github.event.repository.private }}" -eq "true") {
            Write-Error "Stable updater publishing requires a public repository so installed clients can fetch latest.json without credentials."
            exit 1
          }

      - name: Require tagged commit is reachable from main
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tag ${{ github.ref_name }} points to a commit that is not reachable from origin/main."
            exit 1
          }

      - name: Resolve published Alpha release history
        if: github.ref_type == 'tag'
        id: release_history
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" > published-releases.json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not read published GitHub releases; release publication is blocked."
            exit 1
          }
          $payload = Get-Content published-releases.json -Raw | ConvertFrom-Json
          $rows = @()
          foreach ($page in @($payload)) {
            if ($page -is [System.Array]) { $rows += @($page) } else { $rows += $page }
          }
          $publishedAlpha = $false
          foreach ($release in $rows) {
            if (
              $release.draft -ne $true -and
              -not [string]::IsNullOrWhiteSpace([string]$release.published_at) -and
              ([string]$release.tag_name) -match '^v\d+\.\d+\.\d+-alpha\.(0|[1-9]\d*)$'
            ) {
              $publishedAlpha = $true
              break
            }
          }
          "published_alpha=$($publishedAlpha.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Require Beta targets a future Stable version
        if: github.ref_type == 'tag' && steps.channel.outputs.channel == 'beta'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release_channel_policy.py `
            --beta-tag "${{ github.ref_name }}" `
            --published-releases-json published-releases.json

      - name: Require Alpha targets a future Stable version
        if: github.ref_type == 'tag' && steps.channel.outputs.channel == 'alpha'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release_channel_policy.py `
            --alpha-tag "${{ github.ref_name }}" `
            --published-releases-json published-releases.json

      - name: Require manifest-only release channel branch
        if: github.ref_type == 'tag'
        id: channel_branch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $owner, $repo = $env:GITHUB_REPOSITORY.Split('/', 2)
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cellxplorer-release-workflow"
          }
          $refUri = "https://api.github.com/repos/$owner/$repo/git/ref/heads/release-channels"
          try {
            $ref = Invoke-RestMethod -Method Get -Uri $refUri -Headers $headers
          } catch {
            $status = $_.Exception.Response.StatusCode.value__
            if ($status -eq 404) {
              Write-Error "release-channels is not provisioned. Create the manifest-only orphan branch before tagging; the release workflow will never derive it from main."
              exit 1
            }
            throw
          }
          $treeUri = "https://api.github.com/repos/$owner/$repo/git/trees/$($ref.object.sha)?recursive=1"
          $treePayload = Invoke-RestMethod -Method Get -Uri $treeUri -Headers $headers
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE "release-channels-tree.json"),
            ($treePayload | ConvertTo-Json -Depth 10)
          )
          python scripts/release_channels.py `
            --tree-json release-channels-tree.json `
            --target-channel "${{ steps.channel.outputs.channel }}" `
            --published-alpha "${{ steps.release_history.outputs.published_alpha }}"

          $targetPath = "${{ steps.channel.outputs.channel_manifest }}"
          $publishedAlpha = "${{ steps.release_history.outputs.published_alpha }}" -eq "true"
          $expectedPaths = @("README.md", "stable/latest.json", "beta/latest.json")
          if ($publishedAlpha) { $expectedPaths += "alpha/latest.json" }
          $targetSha = ""
          $targetEntry = @($treePayload.tree | Where-Object {
            $_.path -eq $targetPath -and $_.type -eq "blob"
          } | Select-Object -First 1)
          if ($targetEntry.Count -eq 1) {
            $targetSha = $targetEntry[0].sha
          } elseif ("${{ steps.channel.outputs.channel }}" -eq "beta") {
            Write-Host "The first Beta release will create $targetPath."
          } elseif ("${{ steps.channel.outputs.channel }}" -eq "alpha" -and -not $publishedAlpha) {
            Write-Host "The first Alpha release will create $targetPath."
          } else {
            Write-Error "The target channel pointer is missing."
            exit 1
          }
          $nonTarget = [ordered]@{}
          foreach ($path in $expectedPaths) {
            if ($path -eq $targetPath) { continue }
            $entry = @($treePayload.tree | Where-Object {
              $_.path -eq $path -and $_.type -eq "blob"
            } | Select-Object -First 1)
            if ($entry.Count -ne 1) {
              Write-Error "The non-target protected path is missing: $path"
              exit 1
            }
            $nonTarget[$path] = [string]$entry[0].sha
          }
          "target_sha=$targetSha" >> $env:GITHUB_OUTPUT
          "target_ref_sha=$($ref.object.sha)" >> $env:GITHUB_OUTPUT
          $nonTargetJson = $nonTarget | ConvertTo-Json -Compress
          "non_target_json<<NON_TARGET_EOF" >> $env:GITHUB_OUTPUT
          $nonTargetJson >> $env:GITHUB_OUTPUT
          "NON_TARGET_EOF" >> $env:GITHUB_OUTPUT
          # Preserve the legacy scalar outputs for audit tooling while the JSON map
          # above protects every non-target path, including README.md.
          $legacyOtherPath = $nonTarget.Keys | Where-Object { $_ -ne "README.md" } | Select-Object -First 1
          "other_path=$legacyOtherPath" >> $env:GITHUB_OUTPUT
          "other_sha=$($nonTarget[$legacyOtherPath])" >> $env:GITHUB_OUTPUT

      - name: Refuse to replace an already published release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/${{ github.ref_name }}"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cellxplorer-release-workflow"
          }
          try {
            $release = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          } catch {
            $status = $_.Exception.Response.StatusCode.value__
            if ($status -eq 404) {
              Write-Host "No existing release for ${{ github.ref_name }}; draft staging may proceed."
              exit 0
            }
            throw
          }
          if (-not $release.draft) {
            Write-Error "Release ${{ github.ref_name }} is already published. Published versions are immutable; cut a new patch tag instead."
            exit 1
          }
          Write-Host "Existing draft release found; draft assets may be replaced before final publication."

      - name: Verify maintained version declarations
        if: github.ref_type == 'tag'
        shell: pwsh
        run: python scripts/check_versions.py --expected-version "${{ github.ref_name }}"

      - name: Verify maintained version declarations (build-only)
        if: github.ref_type != 'tag'
        shell: pwsh
        run: python scripts/check_versions.py

      - name: Extract release notes
        shell: pwsh
        run: |
          python scripts/release_notes.py `
            --expected-version "${{ steps.version.outputs.version }}" `
            --output release-notes.md

      - name: Require updater signing secrets
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY is required for publishing."
            exit 1
          }

      - name: Resolve exact-SHA canonical main preflight
        if: github.ref_type == 'tag'
        id: preflight_reuse
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/resolve_preflight_reuse.py `
            --repository "$env:GITHUB_REPOSITORY" `
            --sha "$env:GITHUB_SHA" `
            --output "$env:GITHUB_OUTPUT"

      - name: Run canonical release-local preflight fallback
        if: github.ref_type != 'tag' || steps.preflight_reuse.outputs.reuse_preflight != 'true'
        shell: pwsh
        env:
          VITE_CELLXPLORER_CHANNEL: ${{ steps.channel.outputs.channel }}
        run: python scripts/preflight.py --no-cache

      - name: Stamp release-local preflight frontend
        if: github.ref_type != 'tag' || steps.preflight_reuse.outputs.reuse_preflight != 'true'
        shell: pwsh
        run: python scripts/frontend_channel.py write --channel "${{ steps.channel.outputs.channel }}"

      - parallel:
          - name: Build requested frontend channel
            if: github.ref_type == 'tag' && steps.preflight_reuse.outputs.reuse_preflight == 'true'
            shell: pwsh
            run: python scripts/build_frontend_channel.py "${{ steps.channel.outputs.channel }}"

          - name: Build Python sidecar
            if: github.ref_type == 'tag' && steps.preflight_reuse.outputs.reuse_preflight == 'true'
            shell: pwsh
            run: .\scripts\build-app.ps1 -Channel "${{ steps.channel.outputs.channel }}" -SkipInstall -SkipFrontend -SkipInstaller -ForceBackend

      - name: Build Python sidecar (release-local preflight fallback)
        if: github.ref_type != 'tag' || steps.preflight_reuse.outputs.reuse_preflight != 'true'
        shell: pwsh
        run: .\scripts\build-app.ps1 -Channel "${{ steps.channel.outputs.channel }}" -SkipInstall -SkipFrontend -SkipInstaller -ForceBackend

      - name: Verify requested frontend channel stamp
        shell: pwsh
        run: python scripts/frontend_channel.py verify --channel "${{ steps.channel.outputs.channel }}"

      - name: Verify packaged inputs exist
        shell: pwsh
        run: |
          if (-not (Test-Path "frontend/dist/index.html")) {
            Write-Error "Missing frontend/dist/index.html after preflight."
            exit 1
          }
          # onedir backend (spec 030): the launcher lives inside its resource folder
          # next to _internal/, not as a single-file sidecar.
          $backend = "src-tauri/binaries/backend/cellxplorer-backend.exe"
          if (-not (Test-Path $backend)) {
            Write-Error "Missing backend launcher at $backend"
            exit 1
          }
          if (-not (Test-Path "src-tauri/binaries/backend/_internal")) {
            Write-Error "Missing backend _internal folder; onedir bundle is incomplete."
            exit 1
          }

      # A file-existence check cannot catch a sidecar that starts and dies at
      # import -- which is exactly what release 0.17.0 shipped. Run the binary.
      - name: Smoke test the packaged backend
        shell: pwsh
        run: python scripts/smoke_packaged_backend.py

      - name: Load release notes body
        id: release_notes
        shell: pwsh
        run: |
          $content = Get-Content release-notes.md -Raw
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<RELEASE_NOTES_EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $content
          Add-Content -Path $env:GITHUB_OUTPUT -Value "RELEASE_NOTES_EOF"

      - name: Reverify frontend channel immediately before packaging
        shell: pwsh
        run: python scripts/frontend_channel.py verify --channel "${{ steps.channel.outputs.channel }}"

      - name: Stage signed draft release
        if: github.ref_type == 'tag'
        id: tauri_release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_CELLXPLORER_CHANNEL: ${{ steps.channel.outputs.channel }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.channel.outputs.product_name }} ${{ steps.version.outputs.version }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.is_prerelease == 'true' }}
          tauriScript: npm run tauri
          args: ${{ steps.channel.outputs.config_args }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          uploadPlainBinary: false

      - name: Build release artifacts only
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_CELLXPLORER_CHANNEL: ${{ steps.channel.outputs.channel }}
        with:
          tauriScript: npm run tauri
          args: ${{ steps.channel.outputs.config_args }}
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          uploadPlainBinary: false

      - name: Locate generated updater manifest
        if: github.ref_type == 'tag'
        id: manifest
        shell: pwsh
        run: |
          $manifest = Join-Path $env:GITHUB_WORKSPACE "latest.json"
          if (-not (Test-Path $manifest)) {
            Write-Error "Could not find generated latest.json at repository root ($manifest)."
            exit 1
          }
          "path=$manifest" >> $env:GITHUB_OUTPUT

      - name: Export draft release assets metadata
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseId = "${{ steps.tauri_release.outputs.releaseId }}"
          if ([string]::IsNullOrWhiteSpace($releaseId)) {
            Write-Error "tauri-action did not provide releaseId."
            exit 1
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?per_page=100"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cellxplorer-release-workflow"
          }
          # Persist the raw GitHub API JSON. ConvertTo-Json mangles Object[] payloads
          # (nested arrays / stringified rows) and breaks verify_updater_manifest.py.
          $response = Invoke-WebRequest -Method Get -Uri $uri -Headers $headers
          $content = $response.Content
          if ([string]::IsNullOrWhiteSpace($content)) {
            Write-Error "GitHub release assets response was empty."
            exit 1
          }
          $parsed = $content | ConvertFrom-Json
          if ($null -eq $parsed) {
            Write-Error "GitHub release assets response was not valid JSON."
            exit 1
          }
          $assets = @($parsed)
          if ($assets.Count -lt 1) {
            Write-Error "Draft release has no assets to verify."
            exit 1
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE "release-assets.json"),
            $content
          )

      - name: Rewrite draft updater manifest to public download URL
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-Content release-assets.json -Raw | ConvertFrom-Json
          if ($assets -isnot [System.Array]) { $assets = @($assets) }
          $latest = $assets | Where-Object { $_.name -eq "latest.json" } | Select-Object -First 1
          $signatures = @($assets | Where-Object { $_.name -like "*.exe.sig" })
          if (-not $latest) { Write-Error "Draft release is missing latest.json asset."; exit 1 }
          if ($signatures.Count -ne 1) {
            Write-Error "Draft release must contain exactly one NSIS .exe.sig asset; found $($signatures.Count)."
            exit 1
          }
          $setupName = $signatures[0].name.Substring(0, $signatures[0].name.Length - ".sig".Length)
          $setup = $assets | Where-Object { $_.name -eq $setupName } | Select-Object -First 1
          if (-not $setup) { Write-Error "Draft release is missing installer $setupName."; exit 1 }
          $browserUrl = [string]$setup.browser_download_url
          if ([string]::IsNullOrWhiteSpace($browserUrl)) {
            Write-Error "Draft installer metadata is missing browser_download_url."
            exit 1
          }

          $manifestPath = "${{ steps.manifest.outputs.path }}"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($null -eq $manifest.platforms) {
            Write-Error "Generated updater manifest has no platforms object."
            exit 1
          }
          $windowsEntries = @($manifest.platforms.psobject.Properties | Where-Object {
            $_.Name.StartsWith("windows-") -and $_.Value -is [pscustomobject]
          })
          if ($windowsEntries.Count -lt 1) {
            Write-Error "Generated updater manifest has no Windows platform entries."
            exit 1
          }
          foreach ($entry in $windowsEntries) {
            $entry.Value.url = $browserUrl
          }
          $publicManifestPath = Join-Path $env:GITHUB_WORKSPACE "public-latest.json"
          [System.IO.File]::WriteAllText(
            $publicManifestPath,
            ($manifest | ConvertTo-Json -Depth 20),
            (New-Object System.Text.UTF8Encoding($false))
          )

          $releaseId = "${{ steps.tauri_release.outputs.releaseId }}"
          $owner, $repo = $env:GITHUB_REPOSITORY.Split('/', 2)
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cellxplorer-release-workflow"
          }
          # Replace the Tauri action's API-only latest.json asset while the
          # release is still draft. The updater must receive a public browser
          # download URL because installed clients do not send GitHub API auth.
          Invoke-RestMethod -Method Delete -Uri ([string]$latest.url) -Headers $headers
          $uploadUri = "https://uploads.github.com/repos/$owner/$repo/releases/$releaseId/assets?name=latest.json"
          $publicManifestBytes = [System.IO.File]::ReadAllBytes($publicManifestPath)
          $uploaded = Invoke-RestMethod `
            -Method Post `
            -Uri $uploadUri `
            -Headers $headers `
            -ContentType "application/octet-stream" `
            -Body $publicManifestBytes
          if ([string]$uploaded.name -ne "latest.json") {
            Write-Error "GitHub did not return the replacement latest.json asset."
            exit 1
          }

          $assetsUri = "https://api.github.com/repos/$owner/$repo/releases/$releaseId/assets?per_page=100"
          $assetsResponse = Invoke-WebRequest -Method Get -Uri $assetsUri -Headers $headers
          if ([string]::IsNullOrWhiteSpace($assetsResponse.Content)) {
            Write-Error "GitHub release assets response was empty after replacing latest.json."
            exit 1
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE "release-assets.json"),
            $assetsResponse.Content,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Download staged draft manifest and signature
        if: github.ref_type == 'tag'
        id: staged_assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-Content release-assets.json -Raw | ConvertFrom-Json
          if ($assets -isnot [System.Array]) { $assets = @($assets) }
          Write-Host "Staged draft assets: $((@($assets | ForEach-Object { $_.name }) -join ', '))"
          $latest = $assets | Where-Object { $_.name -eq "latest.json" } | Select-Object -First 1
          $signatures = @($assets | Where-Object { $_.name -like "*.exe.sig" })
          if (-not $latest) { Write-Error "Draft release is missing latest.json asset."; exit 1 }
          if ($signatures.Count -ne 1) {
            Write-Error "Draft release must contain exactly one NSIS .exe.sig asset; found $($signatures.Count)."
            exit 1
          }
          $sig = $signatures[0]
          $setupName = $sig.name.Substring(0, $sig.name.Length - ".sig".Length)
          $setup = $assets | Where-Object { $_.name -eq $setupName } | Select-Object -First 1
          if (-not $setup) { Write-Error "Draft release is missing installer $setupName."; exit 1 }
          "setup_name=$setupName" >> $env:GITHUB_OUTPUT
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/octet-stream"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cellxplorer-release-workflow"
          }
          # Verify the exact manifest bytes prepared for the replacement upload.
          # Reading the draft asset back immediately after a delete/re-upload can
          # observe stale GitHub asset state, which made the previous release gate
          # validate a different payload than the one it had just uploaded.
          $publicManifestPath = Join-Path $env:GITHUB_WORKSPACE "public-latest.json"
          if (-not (Test-Path -LiteralPath $publicManifestPath)) {
            Write-Error "The rewritten public updater manifest is missing."
            exit 1
          }
          [System.IO.File]::Copy(
            $publicManifestPath,
            (Join-Path $env:GITHUB_WORKSPACE "uploaded-latest.json"),
            $true
          )
          Invoke-RestMethod -Uri $sig.url -Headers $headers -OutFile uploaded-setup.sig

      - name: Verify updater manifest
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $owner, $repo = $env:GITHUB_REPOSITORY.Split('/', 2)
          $verificationOutput = @(& python scripts/verify_updater_manifest.py `
            --manifest uploaded-latest.json `
            --expected-version "${{ steps.version.outputs.version }}" `
            --notes-file release-notes.md `
            --owner $owner `
            --repo $repo `
            --release-assets release-assets.json `
            --tauri-conf ${{ steps.channel.outputs.updater_key_conf }} `
            --uploaded-signature uploaded-setup.sig `
            --setup-exe-name "${{ steps.staged_assets.outputs.setup_name }}" `
            --channel ${{ steps.channel.outputs.channel }} `
            --expected-product-name "${{ steps.channel.outputs.product_name }}" 2>&1)
          $verificationExitCode = $LASTEXITCODE
          $verificationOutput | ForEach-Object { Write-Host $_ }
          if ($verificationExitCode -ne 0) {
            $diagnostic = ($verificationOutput | ForEach-Object { "$($_)" }) -join " "
            if ([string]::IsNullOrWhiteSpace($diagnostic)) {
              $diagnostic = "Verifier exited with code $verificationExitCode without diagnostic output."
            }
            $diagnostic = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Updater manifest verification::$diagnostic"
            exit $verificationExitCode
          }

      - name: Publish verified draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseId = "${{ steps.tauri_release.outputs.releaseId }}"
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cellxplorer-release-workflow"
          }
          $isPrerelease = "${{ steps.channel.outputs.is_prerelease }}" -eq 'true'
          $body = @{ draft = $false; prerelease = $isPrerelease } | ConvertTo-Json
          Invoke-RestMethod -Method Patch -Uri $uri -Headers $headers -Body $body -ContentType "application/json"
          Write-Host "Published verified release ${{ github.ref_name }}."

      - name: Publish channel manifest pointer
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $owner, $repo = $env:GITHUB_REPOSITORY.Split('/', 2)
          $channelPath = "${{ steps.channel.outputs.channel_manifest }}"
          $version = "${{ steps.version.outputs.version }}"
          $product = "${{ steps.channel.outputs.product_name }}"
          $branch = "release-channels"
          $manifestBytes = [System.IO.File]::ReadAllBytes("uploaded-latest.json")
          $manifestB64 = [Convert]::ToBase64String($manifestBytes)
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cellxplorer-release-workflow"
          }

          $expectedSha = "${{ steps.channel_branch.outputs.target_sha }}"
          $expectedRefSha = "${{ steps.channel_branch.outputs.target_ref_sha }}"
          $branchRef = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$owner/$repo/git/ref/heads/$branch" -Headers $headers
          if ($branchRef.object.sha -ne $expectedRefSha) {
            Write-Error "The release channel branch changed after the publication gate."
            exit 1
          }
          if (-not [string]::IsNullOrWhiteSpace($expectedSha)) {
            $existingUri = "https://api.github.com/repos/$owner/$repo/contents/${channelPath}?ref=${branch}"
            $existing = Invoke-RestMethod -Method Get -Uri $existingUri -Headers $headers
            if ($existing.sha -ne $expectedSha) {
              Write-Error "The target channel pointer changed after the release gate. Refusing to overwrite it."
              exit 1
            }
          }

          $nonTarget = ConvertFrom-Json '${{ steps.channel_branch.outputs.non_target_json }}'
          if (-not ($nonTarget.psobject.Properties.Name -contains "README.md")) {
            Write-Error "README.md was not included in the protected non-target snapshot."
            exit 1
          }
          foreach ($protected in @($nonTarget.psobject.Properties)) {
            $protectedPath = $protected.Name
            $currentProtected = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$owner/$repo/contents/${protectedPath}?ref=${branch}" -Headers $headers
            if ($currentProtected.sha -ne [string]$protected.Value) {
              Write-Error "The non-target protected path changed after the release gate: $protectedPath"
              exit 1
            }
          }

          $commitMessage = switch ("${{ steps.channel.outputs.channel }}") {
            "stable" { "Publish CellXplorer stable channel $version"; break }
            "beta" { "Publish CellXplorer beta channel $version"; break }
            "alpha" { "Publish CellXplorer alpha channel $version"; break }
            default { Write-Error "Unsupported release channel for pointer publication."; exit 1 }
          }
          # Use the Git data API rather than Contents PUT so both replacement and
          # first-time creation are protected by an atomic non-force ref update.
          # Contents PUT cannot express an expected branch tip when the file is absent.
          $baseCommit = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$owner/$repo/git/commits/$expectedRefSha" -Headers $headers
          $blobBody = @{
            content = $manifestB64
            encoding = "base64"
          } | ConvertTo-Json
          $blobResult = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$owner/$repo/git/blobs" -Headers $headers -Body $blobBody -ContentType "application/json"
          if ([string]::IsNullOrWhiteSpace($blobResult.sha)) {
            Write-Error "GitHub did not return the channel manifest blob SHA."
            exit 1
          }
          $treeBody = @{
            base_tree = $baseCommit.tree.sha
            tree = @(@{
                path = $channelPath
                mode = "100644"
                type = "blob"
                sha = $blobResult.sha
              })
          } | ConvertTo-Json -Depth 10
          $treeResult = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$owner/$repo/git/trees" -Headers $headers -Body $treeBody -ContentType "application/json"
          if ([string]::IsNullOrWhiteSpace($treeResult.sha)) {
            Write-Error "GitHub did not return the release-channel tree SHA."
            exit 1
          }
          $commitBody = @{
            message = $commitMessage
            tree = $treeResult.sha
            parents = @($expectedRefSha)
          } | ConvertTo-Json -Depth 10
          $commitResult = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$owner/$repo/git/commits" -Headers $headers -Body $commitBody -ContentType "application/json"
          $newCommitSha = [string]$commitResult.sha
          if ([string]::IsNullOrWhiteSpace($newCommitSha)) {
            Write-Error "GitHub did not return the release-channel commit SHA."
            exit 1
          }
          $refBody = @{
            sha = $newCommitSha
            force = $false
          } | ConvertTo-Json
          $updatedRef = Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/$owner/$repo/git/refs/heads/$branch" -Headers $headers -Body $refBody -ContentType "application/json"
          if ($updatedRef.object.sha -ne $newCommitSha) {
            Write-Error "GitHub did not update the release-channel ref to the expected commit."
            exit 1
          }
          $publishedCommit = $newCommitSha

          $publishedUri = "https://api.github.com/repos/$owner/$repo/contents/${channelPath}?ref=${publishedCommit}"
          $contents = Invoke-RestMethod -Method Get -Uri $publishedUri -Headers $headers
          $remoteBytes = [Convert]::FromBase64String($contents.content.Replace("`n", ""))
          $localBytes = [System.IO.File]::ReadAllBytes("uploaded-latest.json")
          function Assert-BytesEqual([byte[]]$expected, [byte[]]$actual, [string]$label) {
            if ($expected.Length -ne $actual.Length) {
              throw "$label byte length mismatch."
            }
            for ($i = 0; $i -lt $expected.Length; $i++) {
              if ($expected[$i] -ne $actual[$i]) {
                throw "$label content mismatch."
              }
            }
          }
          Assert-BytesEqual $localBytes $remoteBytes "Channel manifest bytes after Git data API update"

          $otherPath = "${{ steps.channel_branch.outputs.other_path }}"
          $other = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$owner/$repo/contents/${otherPath}?ref=${publishedCommit}" -Headers $headers
          if ($other.sha -ne "${{ steps.channel_branch.outputs.other_sha }}") {
            Write-Error "The non-target channel pointer changed during publication."
            exit 1
          }

          foreach ($protected in @($nonTarget.psobject.Properties)) {
            $protectedPath = $protected.Name
            $publishedProtected = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$owner/$repo/contents/${protectedPath}?ref=${publishedCommit}" -Headers $headers
            if ($publishedProtected.sha -ne [string]$protected.Value) {
              Write-Error "The non-target protected path changed during publication: $protectedPath"
              exit 1
            }
          }

          $rawUri = "https://raw.githubusercontent.com/$owner/$repo/$branch/$channelPath"
          $rawMatched = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              Invoke-WebRequest -Method Get -Uri $rawUri -Headers @{ "User-Agent" = "cellxplorer-release-workflow" } -OutFile remote-channel-latest-raw.json
              $rawBytes = [System.IO.File]::ReadAllBytes("remote-channel-latest-raw.json")
              Assert-BytesEqual $localBytes $rawBytes "Public raw channel manifest"
              $rawMatched = $true
              break
            } catch {
              if ($attempt -eq 6) { throw }
              Start-Sleep -Seconds 5
            }
          }
          if (-not $rawMatched) {
            throw "Public raw channel manifest did not become available."
          }

          [System.IO.File]::WriteAllBytes("remote-channel-latest.json", $remoteBytes)

          $publishedTreeUri = "https://api.github.com/repos/$owner/$repo/git/trees/$($treeResult.sha)?recursive=1"
          $publishedTree = Invoke-RestMethod -Method Get -Uri $publishedTreeUri -Headers $headers
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE "published-release-channels-tree.json"),
            ($publishedTree | ConvertTo-Json -Depth 10)
          )
          # The successful undraft above is authoritative for the Alpha release
          # created by this job, even if the initial release-history listing was
          # captured before GitHub exposed that newly published release.
          $postPublishedAlpha = (
            "${{ steps.release_history.outputs.published_alpha }}" -eq "true" -or
            "${{ steps.channel.outputs.channel }}" -eq "alpha"
          )
          python scripts/release_channels.py `
            --tree-json published-release-channels-tree.json `
            --target-channel "${{ steps.channel.outputs.channel }}" `
            --published-alpha "$($postPublishedAlpha.ToString().ToLowerInvariant())"

          python scripts/verify_updater_manifest.py `
            --manifest remote-channel-latest.json `
            --expected-version "$version" `
            --notes-file release-notes.md `
            --owner $owner `
            --repo $repo `
            --release-assets release-assets.json `
            --tauri-conf ${{ steps.channel.outputs.updater_key_conf }} `
            --channel ${{ steps.channel.outputs.channel }} `
            --expected-product-name "$product"
          Write-Host "Published $channelPath on $branch."
