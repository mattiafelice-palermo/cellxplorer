name: Publish CellXplorer release

# Staged draft publishing (Spec 019 review R2):
# 1) create/update a draft GitHub Release with signed NSIS + latest.json
# 2) verify local latest.json against release-asset metadata
# 3) undraft only after verification succeeds
#
# Pinned third-party actions (full 40-char SHAs):
# - actions/checkout@v6.0.1
# - actions/setup-python@v6.0.0
# - actions/setup-node@v6.0.0
# - dtolnay/rust-toolchain stable (2026-06-30)
# - Swatinem/rust-cache@v2.8.2
# - tauri-apps/tauri-action@v1.0.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel for manual build-only dispatch
        type: choice
        options:
          - stable
          - beta
        default: stable

permissions:
  contents: write
  actions: write

concurrency:
  group: cellxplorer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Cancel redundant main preflight for this commit
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          # Best-effort only: main pushes often finish the preflight gate before cancel runs.
          $ErrorActionPreference = "Continue"
          $sha = $env:GITHUB_SHA
          $ids = [System.Collections.Generic.HashSet[string]]::new()
          foreach ($status in @("queued", "pending", "waiting", "requested", "in_progress")) {
            $json = gh run list --workflow preflight.yml --commit $sha --status $status --json databaseId 2>$null
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($json)) {
              continue
            }
            foreach ($row in @($json | ConvertFrom-Json)) {
              if ($null -ne $row.databaseId) {
                [void]$ids.Add([string]$row.databaseId)
              }
            }
          }
          foreach ($id in $ids) {
            Write-Host "Canceling CellXplorer preflight run $id for $sha (release preflight covers this commit)."
            gh run cancel $id
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Cancel of run $id returned $LASTEXITCODE (ignored)."
            }
          }
          exit 0

      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-06-30

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: src-tauri -> target

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller
          python -m pip check

      - name: Install frontend and Tauri CLI dependencies
        shell: pwsh
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Resolve release channel
        id: channel
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/release_tag.py --tag "$env:GITHUB_REF_NAME"
            if ($env:GITHUB_REF_NAME -match '-beta\.') {
              "channel=beta" >> $env:GITHUB_OUTPUT
              "product_name=CellXplorer Beta" >> $env:GITHUB_OUTPUT
              "config_args=--config src-tauri/tauri.beta.conf.json" >> $env:GITHUB_OUTPUT
              "channel_manifest=beta/latest.json" >> $env:GITHUB_OUTPUT
              "is_prerelease=true" >> $env:GITHUB_OUTPUT
              "updater_key_conf=src-tauri/tauri.conf.json" >> $env:GITHUB_OUTPUT
            } else {
              "channel=stable" >> $env:GITHUB_OUTPUT
              "product_name=CellXplorer" >> $env:GITHUB_OUTPUT
              "config_args=" >> $env:GITHUB_OUTPUT
              "channel_manifest=stable/latest.json" >> $env:GITHUB_OUTPUT
              "is_prerelease=false" >> $env:GITHUB_OUTPUT
              "updater_key_conf=src-tauri/tauri.conf.json" >> $env:GITHUB_OUTPUT
            }
          } else {
            $selected = "${{ github.event.inputs.channel }}"
            if ([string]::IsNullOrWhiteSpace($selected)) { $selected = "stable" }
            if ($selected -eq "beta") {
              "channel=beta" >> $env:GITHUB_OUTPUT
              "product_name=CellXplorer Beta" >> $env:GITHUB_OUTPUT
              "config_args=--config src-tauri/tauri.beta.conf.json" >> $env:GITHUB_OUTPUT
              "channel_manifest=beta/latest.json" >> $env:GITHUB_OUTPUT
              "is_prerelease=true" >> $env:GITHUB_OUTPUT
              "updater_key_conf=src-tauri/tauri.conf.json" >> $env:GITHUB_OUTPUT
            } else {
              "channel=stable" >> $env:GITHUB_OUTPUT
              "product_name=CellXplorer" >> $env:GITHUB_OUTPUT
              "config_args=" >> $env:GITHUB_OUTPUT
              "channel_manifest=stable/latest.json" >> $env:GITHUB_OUTPUT
              "is_prerelease=false" >> $env:GITHUB_OUTPUT
              "updater_key_conf=src-tauri/tauri.conf.json" >> $env:GITHUB_OUTPUT
            }
          }

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Require publishable SemVer tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: python scripts/release_tag.py --tag "${{ github.ref_name }}"

      - name: Require public repository for publishing
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          if ("${{ github.event.repository.private }}" -eq "true") {
            Write-Error "Stable updater publishing requires a public repository so installed clients can fetch latest.json without credentials."
            exit 1
          }

      - name: Require tagged commit is reachable from main
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tag ${{ github.ref_name }} points to a commit that is not reachable from origin/main."
            exit 1
          }

      - name: Require Beta targets a future Stable version
        if: github.ref_type == 'tag' && steps.channel.outputs.channel == 'beta'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" > published-releases.json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not read published GitHub releases; Beta publication is blocked."
            exit 1
          }
          python scripts/release_channel_policy.py `
            --beta-tag "${{ github.ref_name }}" `
            --published-releases-json published-releases.json

      - name: Require manifest-only release channel branch
        if: github.ref_type == 'tag'
        id: channel_branch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $owner, $repo = $env:GITHUB_REPOSITORY.Split('/', 2)
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cellxplorer-release-workflow"
          }
          $refUri = "https://api.github.com/repos/$owner/$repo/git/ref/heads/release-channels"
          try {
            $ref = Invoke-RestMethod -Method Get -Uri $refUri -Headers $headers
          } catch {
            $status = $_.Exception.Response.StatusCode.value__
            if ($status -eq 404) {
              Write-Error "release-channels is not provisioned. Create the manifest-only orphan branch before tagging; the release workflow will never derive it from main."
              exit 1
            }
            throw
          }
          $treeUri = "https://api.github.com/repos/$owner/$repo/git/trees/$($ref.object.sha)?recursive=1"
          $treeResponse = Invoke-WebRequest -Method Get -Uri $treeUri -Headers $headers
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE "release-channels-tree.json"),
            $treeResponse.Content
          )
          python scripts/release_channels.py `
            --tree-json release-channels-tree.json `
            --target-channel "${{ steps.channel.outputs.channel }}"

          $targetPath = "${{ steps.channel.outputs.channel_manifest }}"
          $otherPath = if ($targetPath -eq "stable/latest.json") {
            "beta/latest.json"
          } else {
            "stable/latest.json"
          }
          $targetSha = ""
          try {
            $target = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$owner/$repo/contents/$targetPath?ref=release-channels" -Headers $headers
            $targetSha = $target.sha
          } catch {
            $status = $_.Exception.Response.StatusCode.value__
            if ($status -ne 404 -or "${{ steps.channel.outputs.channel }}" -ne "beta") {
              throw
            }
            Write-Host "The first Beta release will create beta/latest.json."
          }
          $other = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$owner/$repo/contents/$otherPath?ref=release-channels" -Headers $headers
          "target_sha=$targetSha" >> $env:GITHUB_OUTPUT
          "other_path=$otherPath" >> $env:GITHUB_OUTPUT
          "other_sha=$($other.sha)" >> $env:GITHUB_OUTPUT

      - name: Refuse to replace an already published release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/${{ github.ref_name }}"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cellxplorer-release-workflow"
          }
          try {
            $release = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          } catch {
            $status = $_.Exception.Response.StatusCode.value__
            if ($status -eq 404) {
              Write-Host "No existing release for ${{ github.ref_name }}; draft staging may proceed."
              exit 0
            }
            throw
          }
          if (-not $release.draft) {
            Write-Error "Release ${{ github.ref_name }} is already published. Published versions are immutable; cut a new patch tag instead."
            exit 1
          }
          Write-Host "Existing draft release found; draft assets may be replaced before final publication."

      - name: Verify maintained version declarations
        if: github.ref_type == 'tag'
        shell: pwsh
        run: python scripts/check_versions.py --expected-version "${{ github.ref_name }}"

      - name: Verify maintained version declarations (build-only)
        if: github.ref_type != 'tag'
        shell: pwsh
        run: python scripts/check_versions.py

      - name: Extract release notes
        shell: pwsh
        run: |
          python scripts/release_notes.py `
            --expected-version "${{ steps.version.outputs.version }}" `
            --output release-notes.md

      - name: Require updater signing secrets
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY is required for publishing."
            exit 1
          }

      - name: Run canonical preflight
        shell: pwsh
        run: python scripts/preflight.py --no-cache

      - name: Build requested frontend channel
        shell: pwsh
        run: python scripts/build_frontend_channel.py "${{ steps.channel.outputs.channel }}"

      - name: Verify requested frontend channel stamp
        shell: pwsh
        run: python scripts/frontend_channel.py verify --channel "${{ steps.channel.outputs.channel }}"

      - name: Build Python sidecar
        shell: pwsh
        run: .\scripts\build-app.ps1 -Channel "${{ steps.channel.outputs.channel }}" -SkipInstall -SkipFrontend -SkipInstaller -ForceBackend

      - name: Verify packaged inputs exist
        shell: pwsh
        run: |
          if (-not (Test-Path "frontend/dist/index.html")) {
            Write-Error "Missing frontend/dist/index.html after preflight."
            exit 1
          }
          $sidecar = "src-tauri/binaries/cellxplorer-backend-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $sidecar)) {
            Write-Error "Missing backend sidecar at $sidecar"
            exit 1
          }

      - name: Load release notes body
        id: release_notes
        shell: pwsh
        run: |
          $content = Get-Content release-notes.md -Raw
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<RELEASE_NOTES_EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $content
          Add-Content -Path $env:GITHUB_OUTPUT -Value "RELEASE_NOTES_EOF"

      - name: Reverify frontend channel immediately before packaging
        shell: pwsh
        run: python scripts/frontend_channel.py verify --channel "${{ steps.channel.outputs.channel }}"

      - name: Stage signed draft release
        if: github.ref_type == 'tag'
        id: tauri_release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_CELLXPLORER_CHANNEL: ${{ steps.channel.outputs.channel }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.channel.outputs.product_name }} ${{ steps.version.outputs.version }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ steps.channel.outputs.is_prerelease == 'true' }}
          tauriScript: npm run tauri
          args: ${{ steps.channel.outputs.config_args }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          uploadPlainBinary: false

      - name: Build release artifacts only
        if: github.ref_type != 'tag'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_CELLXPLORER_CHANNEL: ${{ steps.channel.outputs.channel }}
        with:
          tauriScript: npm run tauri
          args: ${{ steps.channel.outputs.config_args }}
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          uploadPlainBinary: false

      - name: Locate generated updater manifest
        if: github.ref_type == 'tag'
        id: manifest
        shell: pwsh
        run: |
          $manifest = Join-Path $env:GITHUB_WORKSPACE "latest.json"
          if (-not (Test-Path $manifest)) {
            Write-Error "Could not find generated latest.json at repository root ($manifest)."
            exit 1
          }
          "path=$manifest" >> $env:GITHUB_OUTPUT

      - name: Export draft release assets metadata
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseId = "${{ steps.tauri_release.outputs.releaseId }}"
          if ([string]::IsNullOrWhiteSpace($releaseId)) {
            Write-Error "tauri-action did not provide releaseId."
            exit 1
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?per_page=100"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cellxplorer-release-workflow"
          }
          # Persist the raw GitHub API JSON. ConvertTo-Json mangles Object[] payloads
          # (nested arrays / stringified rows) and breaks verify_updater_manifest.py.
          $response = Invoke-WebRequest -Method Get -Uri $uri -Headers $headers
          $content = $response.Content
          if ([string]::IsNullOrWhiteSpace($content)) {
            Write-Error "GitHub release assets response was empty."
            exit 1
          }
          $parsed = $content | ConvertFrom-Json
          if ($null -eq $parsed) {
            Write-Error "GitHub release assets response was not valid JSON."
            exit 1
          }
          $assets = @($parsed)
          if ($assets.Count -lt 1) {
            Write-Error "Draft release has no assets to verify."
            exit 1
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE "release-assets.json"),
            $content
          )

      - name: Download staged draft manifest and signature
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-Content release-assets.json -Raw | ConvertFrom-Json
          if ($assets -isnot [System.Array]) { $assets = @($assets) }
          $version = "${{ steps.version.outputs.version }}".TrimStart('v')
          $product = "${{ steps.channel.outputs.product_name }}"
          $setupName = "${product}_${version}_x64-setup.exe"
          $sigName = "$setupName.sig"
          $latest = $assets | Where-Object { $_.name -eq "latest.json" } | Select-Object -First 1
          $sig = $assets | Where-Object { $_.name -eq $sigName } | Select-Object -First 1
          if (-not $latest) { Write-Error "Draft release is missing latest.json asset."; exit 1 }
          if (-not $sig) { Write-Error "Draft release is missing $sigName asset."; exit 1 }
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/octet-stream"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cellxplorer-release-workflow"
          }
          Invoke-WebRequest -Uri $latest.url -Headers $headers -OutFile uploaded-latest.json
          Invoke-WebRequest -Uri $sig.url -Headers $headers -OutFile uploaded-setup.sig

      - name: Verify updater manifest
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $owner, $repo = $env:GITHUB_REPOSITORY.Split('/', 2)
          python scripts/verify_updater_manifest.py `
            --manifest uploaded-latest.json `
            --expected-version "${{ steps.version.outputs.version }}" `
            --notes-file release-notes.md `
            --owner $owner `
            --repo $repo `
            --release-assets release-assets.json `
            --tauri-conf ${{ steps.channel.outputs.updater_key_conf }} `
            --uploaded-signature uploaded-setup.sig `
            --channel ${{ steps.channel.outputs.channel }} `
            --expected-product-name "${{ steps.channel.outputs.product_name }}"

      - name: Publish verified draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseId = "${{ steps.tauri_release.outputs.releaseId }}"
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cellxplorer-release-workflow"
          }
          $isPrerelease = "${{ steps.channel.outputs.is_prerelease }}" -eq 'true'
          $body = @{ draft = $false; prerelease = $isPrerelease } | ConvertTo-Json
          Invoke-RestMethod -Method Patch -Uri $uri -Headers $headers -Body $body -ContentType "application/json"
          Write-Host "Published verified release ${{ github.ref_name }}."

      - name: Publish channel manifest pointer
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $owner, $repo = $env:GITHUB_REPOSITORY.Split('/', 2)
          $channelPath = "${{ steps.channel.outputs.channel_manifest }}"
          $version = "${{ steps.version.outputs.version }}"
          $product = "${{ steps.channel.outputs.product_name }}"
          $branch = "release-channels"
          $manifestBytes = [System.IO.File]::ReadAllBytes("uploaded-latest.json")
          $manifestB64 = [Convert]::ToBase64String($manifestBytes)
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "cellxplorer-release-workflow"
          }

          $existingUri = "https://api.github.com/repos/$owner/$repo/contents/$channelPath?ref=$branch"
          $expectedSha = "${{ steps.channel_branch.outputs.target_sha }}"
          if ([string]::IsNullOrWhiteSpace($expectedSha)) {
            try {
              $null = Invoke-RestMethod -Method Get -Uri $existingUri -Headers $headers
              Write-Error "The target channel pointer appeared after the release gate. Refusing a racy first write."
              exit 1
            } catch {
              $status = $_.Exception.Response.StatusCode.value__
              if ($status -ne 404) { throw }
            }
          } else {
            $existing = Invoke-RestMethod -Method Get -Uri $existingUri -Headers $headers
            if ($existing.sha -ne $expectedSha) {
              Write-Error "The target channel pointer changed after the release gate. Refusing to overwrite it."
              exit 1
            }
          }

          $commitMessage = if ("${{ steps.channel.outputs.channel }}" -eq "beta") {
            "Publish CellXplorer beta channel $version"
          } else {
            "Publish CellXplorer stable channel $version"
          }
          $putBody = @{
            message = $commitMessage
            content = $manifestB64
            branch = $branch
          }
          if (-not [string]::IsNullOrWhiteSpace($expectedSha)) { $putBody.sha = $expectedSha }
          $putJson = $putBody | ConvertTo-Json
          Invoke-RestMethod -Method Put -Uri "https://api.github.com/repos/$owner/$repo/contents/$channelPath" -Headers $headers -Body $putJson -ContentType "application/json"

          $contents = Invoke-RestMethod -Method Get -Uri $existingUri -Headers $headers
          $remoteBytes = [Convert]::FromBase64String($contents.content.Replace("`n", ""))
          $localBytes = [System.IO.File]::ReadAllBytes("uploaded-latest.json")
          if ($remoteBytes.Length -ne $localBytes.Length) {
            Write-Error "Channel manifest bytes mismatch after GitHub contents update."
            exit 1
          }
          for ($i = 0; $i -lt $localBytes.Length; $i++) {
            if ($remoteBytes[$i] -ne $localBytes[$i]) {
              Write-Error "Channel manifest content mismatch after GitHub contents update."
              exit 1
            }
          }

          $otherPath = "${{ steps.channel_branch.outputs.other_path }}"
          $other = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$owner/$repo/contents/$otherPath?ref=$branch" -Headers $headers
          if ($other.sha -ne "${{ steps.channel_branch.outputs.other_sha }}") {
            Write-Error "The non-target channel pointer changed during publication."
            exit 1
          }

          $rawUrl = "https://raw.githubusercontent.com/$owner/$repo/$branch/$channelPath"
          $cacheBust = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $fetched = $false
          foreach ($attempt in 1..5) {
            Start-Sleep -Seconds 2
            try {
              Invoke-WebRequest -Uri "$rawUrl?cb=$cacheBust" -OutFile remote-channel-latest.json
              $fetched = $true
              break
            } catch {
              Write-Host "Raw channel fetch attempt $attempt failed; retrying..."
            }
          }
          if (-not $fetched) {
            Write-Error "Could not fetch public raw channel manifest from $rawUrl"
            exit 1
          }

          python scripts/verify_updater_manifest.py `
            --manifest remote-channel-latest.json `
            --expected-version "$version" `
            --notes-file release-notes.md `
            --owner $owner `
            --repo $repo `
            --release-assets release-assets.json `
            --tauri-conf ${{ steps.channel.outputs.updater_key_conf }} `
