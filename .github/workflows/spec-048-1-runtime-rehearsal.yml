name: Spec 048.1 runtime rehearsal

on:
  push:
    branches:
      - feature/test-fixture-runtime-optimization

permissions:
  contents: read

jobs:
  seed-rust-cache:
    name: Rehearsal seed shared Rust cache
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-06-30

      - name: Restore or seed production Rust cache
        id: rust_cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: src-tauri -> target
          shared-key: cellxplorer-windows-release
          add-job-id-key: "false"
          save-if: "true"

      - name: Build production Rust dependency graph
        shell: pwsh
        run: |
          Write-Host "rust_cache_hit=${{ steps.rust_cache.outputs.cache-hit }}"
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml
          $timer.Stop()
          Write-Host ("cargo_seconds={0:N2}" -f $timer.Elapsed.TotalSeconds)

  warm-rust-cache:
    name: Rehearsal warm Rust cache
    needs: seed-rust-cache
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-06-30

      - name: Restore seeded production Rust cache
        id: rust_cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: src-tauri -> target
          shared-key: cellxplorer-windows-release
          add-job-id-key: "false"
          save-if: "false"

      - name: Measure warm production Rust dependency graph
        shell: pwsh
        run: |
          Write-Host "rust_cache_hit=${{ steps.rust_cache.outputs.cache-hit }}"
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml
          $timer.Stop()
          Write-Host ("cargo_seconds={0:N2}" -f $timer.Elapsed.TotalSeconds)

  release-inputs:
    name: Rehearse exact-reuse release inputs
    needs: warm-rust-cache
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"

      - parallel:
          - name: Install backend dependencies
            shell: pwsh
            run: |
              python -m pip install --upgrade pip
              python -m pip install -r backend/requirements.txt
              python -m pip install pyinstaller
              python -m pip check

          - name: Install frontend and Tauri CLI dependencies
            shell: pwsh
            run: |
              npm ci
              npm --prefix frontend ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-06-30

      - name: Restore production Rust cache for release-input rehearsal
        id: rust_cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: src-tauri -> target
          shared-key: cellxplorer-windows-release
          add-job-id-key: "false"
          save-if: "false"

      - parallel:
          - name: Build requested frontend channel
            shell: pwsh
            run: |
              $timer = [System.Diagnostics.Stopwatch]::StartNew()
              python scripts/build_frontend_channel.py stable
              $timer.Stop()
              Write-Host ("frontend_seconds={0:N2}" -f $timer.Elapsed.TotalSeconds)

          - name: Build backend sidecar without frontend state
            shell: pwsh
            run: |
              $timer = [System.Diagnostics.Stopwatch]::StartNew()
              .\scripts\build-app.ps1 -Channel stable -SkipInstall -SkipFrontend -SkipInstaller -ForceBackend
              $timer.Stop()
              Write-Host ("sidecar_seconds={0:N2}" -f $timer.Elapsed.TotalSeconds)

      - name: Verify exact-reuse release inputs
        shell: pwsh
        run: |
          python scripts/frontend_channel.py verify --channel stable
          if (-not (Test-Path "frontend/dist/index.html")) {
            throw "Missing frontend/dist/index.html after exact-reuse rehearsal."
          }
          if (-not (Test-Path "src-tauri/binaries/backend/cellxplorer-backend.exe")) {
            throw "Missing backend launcher after exact-reuse rehearsal."
          }
          if (-not (Test-Path "src-tauri/binaries/backend/_internal")) {
            throw "Missing backend _internal folder after exact-reuse rehearsal."
          }

      - name: Smoke test exact-reuse packaged backend
        shell: pwsh
        run: python scripts/smoke_packaged_backend.py
