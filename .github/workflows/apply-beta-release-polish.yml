name: Apply Beta release polish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/beta-release-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          ref: feature/beta-release-polish

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Install focused tooling
        shell: pwsh
        run: |
          python -m pip install -r scripts/requirements-dev.txt
          npm --prefix frontend ci

      - name: Repair one-shot migration anchors
        shell: pwsh
        run: python scripts/fix_apply_beta_release_polish.py

      - name: Apply source and asset fixes
        shell: pwsh
        run: python scripts/apply_beta_release_polish.py

      - name: Run focused verification
        shell: pwsh
        run: |
          python -m unittest tests.test_app_channels tests.test_build_beta_icons -v
          node --test frontend\tests\appChannel.test.ts frontend\tests\appUpdater.test.ts frontend\tests\betaBootstrap.test.ts frontend\tests\betaInstaller.test.ts
          npm --prefix frontend exec -- tsc --noEmit
          cargo test --manifest-path src-tauri\Cargo.toml

      - name: Remove one-shot migration machinery
        shell: pwsh
        run: |
          git rm .github/workflows/apply-beta-release-polish.yml
          git rm scripts/apply_beta_release_polish.py
          git rm scripts/fix_apply_beta_release_polish.py

      - name: Commit generated fixes
        shell: pwsh
        run: |
          git config user.name "CellXplorer release-fix bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Beta restart and branding after installed smoke test"
          git push origin HEAD:feature/beta-release-polish
