name: CellXplorer preflight

on:
  workflow_dispatch:
    inputs:
      compare_dependency_installers:
        description: Compare fresh pip/uv inventories in isolated environments
        type: boolean
        default: false
      seed_release_benchmark_cache:
        description: Seed this dispatch ref's release/test Rust cache for a controlled benchmark
        type: boolean
        default: false
      relay_diagnostics:
        description: Run harmless relay launch diagnostics (not release acceptance)
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  relay-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.relay_diagnostics
    name: Diagnose harmless relay launch
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Prepare exact pinned Tauri NSIS compiler (no installation)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'relay-nsis-3.11.zip'
          Invoke-WebRequest 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -cne 'C7D27F780DDB6CFFB4730138CD1591E841F4B7EDB155856901CDF5F214394FA1') { throw 'NSIS SHA256 mismatch' }
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA1).Hash -cne 'EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D') { throw 'Pinned Tauri NSIS SHA1 mismatch' }
          $tools = [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'tauri'))
          Expand-Archive -LiteralPath $zip -DestinationPath $tools
          $source = [IO.Path]::GetFullPath((Join-Path $tools 'nsis-3.11'))
          $target = [IO.Path]::GetFullPath((Join-Path $tools 'NSIS'))
          if (-not $source.StartsWith($tools + [IO.Path]::DirectorySeparatorChar) -or -not $target.StartsWith($tools + [IO.Path]::DirectorySeparatorChar)) { throw 'Compiler path escaped tools directory' }
          Move-Item -LiteralPath $source -Destination $target
      - name: Trace checked relay launch with unchanged deadlines
        run: python -u scripts/check_update_recovery.py --relay-diagnostic --iterations 30

  preflight:
    name: Clean Windows preflight
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CELLXPLORER_PREFLIGHT_CPU_BUDGET: "4"
      CELLXPLORER_PREFLIGHT_JOBS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - parallel:
          - name: Install backend dependencies
            shell: pwsh
            run: |
              python -m pip install --upgrade pip uv==0.13.6
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $pythonExe = python -c "import sys; print(sys.executable)"
              python -m uv pip install --system --python $pythonExe --default-index https://pypi.org/simple -r backend/requirements.txt
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              python -m pip check

          - name: Install frontend dependencies
            shell: pwsh
            run: npm --prefix frontend ci

      - name: Run CellXplorer preflight
        run: python scripts/preflight.py

  dependency-installer-equivalence:
    name: Fresh pip and uv dependency equivalence
    if: github.event_name == 'workflow_dispatch' && inputs.compare_dependency_installers
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Compare fresh dependency installers
        run: python scripts/compare_ci_installers.py --output dependency-installer-equivalence.json
      - name: Retain installer equivalence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-installer-equivalence
          path: dependency-installer-equivalence.json
          if-no-files-found: error
          retention-days: 14

  rust-cache-warm:
    name: Warm Windows release Rust cache
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.seed_release_benchmark_cache)
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-06-30

      - name: Restore or seed shared release Rust cache
        id: rust_cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: src-tauri -> target
          # At this pinned action revision, shared-key overrides (ignores) key.
          shared-key: cellxplorer-windows-release-and-test-v3-lto-off
          add-job-id-key: "false"
          # Actions caches are scoped to this ref. A manual feature-branch seed
          # cannot overwrite a main-branch cache or satisfy release verification.
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.seed_release_benchmark_cache) }}

      - name: Compile release dependency graph on cache miss
        if: steps.rust_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # The production sidecar is an ignored build artifact and is absent from a clean checkout.
          # Tauri merges this JSON patch for the cache-only compile; release packaging still uses the
          # repository config and verifies the real frontend/sidecar before Tauri runs.
          $env:TAURI_CONFIG = '{"bundle":{"resources":[]},"build":{"frontendDist":null}}'
          # Match Tauri CLI's production feature graph, not the dev-protocol graph.
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile test dependency graph on cache miss
        if: steps.rust_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Warm compilation only. Release still executes every Rust/native test.
          $env:TAURI_CONFIG = '{"bundle":{"resources":[]},"build":{"frontendDist":null}}'
          cargo test --no-run --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
