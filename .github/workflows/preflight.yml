name: CellXplorer preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  preflight:
    name: Clean Windows preflight
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - parallel:
          - name: Install backend dependencies
            shell: pwsh
            run: |
              python -m pip install --upgrade pip
              python -m pip install -r backend/requirements.txt
              python -m pip check

          - name: Install frontend dependencies
            shell: pwsh
            run: npm --prefix frontend ci

      - name: Run CellXplorer preflight
        run: python scripts/preflight.py

  rust-cache-warm:
    name: Warm Windows release Rust cache
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-06-30

      - name: Restore or seed shared release Rust cache
        id: rust_cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: src-tauri -> target
          shared-key: cellxplorer-windows-release
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile release dependency graph on cache miss
        if: steps.rust_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # The production sidecar is an ignored build artifact and is absent from a clean checkout.
          # Tauri merges this JSON patch for the cache-only compile; release packaging still uses the
          # repository config and verifies the real sidecar before Tauri runs.
          $env:TAURI_CONFIG = '{"bundle":{"resources":[]}}'
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
