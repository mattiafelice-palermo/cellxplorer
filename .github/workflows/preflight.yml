name: CellXplorer preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gate:
    name: Release-tag gate
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether main preflight is needed
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual dispatch always runs preflight."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --force --tags
          tags="$(git tag --points-at "${GITHUB_SHA}" | grep -E '^v' || true)"
          if [ -n "${tags}" ]; then
            echo "Skipping main preflight; release tag(s) point at this commit:"
            echo "${tags}"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release tag on this commit; running main preflight."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Clean Windows preflight
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run CellXplorer preflight
        run: python scripts/preflight.py
