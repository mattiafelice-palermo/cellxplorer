[package]
name = "cellxplorer"
version = "0.14.1"
description = "CellXplorer desktop app"
authors = ["CellXplorer"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-shell = "2"

# Local packaging runs rebuild this crate every time (tauri-build re-runs its
# build script), and the release default of no incremental data meant a full
# recompile plus link on each pass.
[profile.release]
incremental = true
