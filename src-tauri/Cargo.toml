[package]
name = "cellxplorer"
version = "0.5.0"
description = "CellXplorer desktop app"
authors = ["CellXplorer"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
