[package]
name = "cellxplorer"
version = "0.28.0-alpha.7"
description = "CellXplorer desktop app"
authors = ["CellXplorer"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1.0.28"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
notify-rust = "4.18"
winreg = "0.55"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Local packaging runs rebuild this crate every time (tauri-build re-runs its
# build script), and the release default of no incremental data meant a full
# recompile plus link on each pass.
[profile.release]
incremental = true
