<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <title>CellXplorer</title>
  </head>
  <body>
    <div id="root">
      <style>
        #cx-boot-splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background: #ffffff;
          color: #212529;
        }
        #cx-boot-splash .cx-boot-sub {
          font-size: 13px;
          color: #868e96;
        }
        #cx-boot-splash .cx-boot-track {
          width: 220px;
          height: 4px;
          border-radius: 999px;
          overflow: hidden;
          background: #e9ecef;
        }
        #cx-boot-splash .cx-boot-bar {
          width: 45%;
          height: 100%;
          border-radius: 999px;
          background: #12b886;
          animation: cx-boot-slide 1.2s ease-in-out infinite;
        }
        @keyframes cx-boot-slide {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(320%); }
        }
        @media (prefers-color-scheme: dark) {
          #cx-boot-splash {
            background: #242424;
            color: #f8f9fa;
          }
          #cx-boot-splash .cx-boot-sub {
            color: #909296;
          }
          #cx-boot-splash .cx-boot-track {
            background: #373a40;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #cx-boot-splash .cx-boot-bar {
            width: 100%;
            opacity: 0.7;
            animation: none;
          }
        }
      </style>
      <div id="cx-boot-splash" role="progressbar" aria-label="Starting CellXplorer">
        <img src="/app-icon.png" alt="" width="40" height="40" style="display:block;" />
        <div style="font-size: 16px; font-weight: 700; letter-spacing: -0.01em;">CellXplorer</div>
        <div class="cx-boot-track"><div class="cx-boot-bar"></div></div>
        <div class="cx-boot-sub">Starting application…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
